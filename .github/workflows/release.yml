name: Release Libraries

on:
  push:
    branches:
      - main # 정식 버전
      - pre-release # 베타 버전

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 배포 도중 취소되면 tag · 패키지가 반만 남는다. 뒤 실행은 앞 실행이 끝나기를 기다린다.
  cancel-in-progress: false

jobs:
  release:
    name: Release Libraries
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ vars.PNPM_VERSION }}

      - name: Setup Node.js (pnpm cache)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@${{ github.repository_owner }}"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Git Configuration
        run: |
          git config user.name "${{ vars.RELEASE_GIT_NAME }}"
          git config user.email "${{ vars.RELEASE_GIT_EMAIL }}"
          # CI에서는 husky hooks(보호 브랜치 차단)를 명시적으로 무력화
          git config core.hooksPath /dev/null

      # Beta 배포
      - name: NX Release (Beta)
        if: github.ref == 'refs/heads/pre-release'
        run: pnpm release:npm:beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          HUSKY: 0

      # Stable 배포
      - name: NX Release (Stable)
        if: github.ref == 'refs/heads/main'
        run: pnpm release:npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          HUSKY: 0
