name: PR Quality Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# 동일한 PR에 새로운 커밋이 푸시되면 진행 중이던 이전 워크플로우를 취소하여 리소스를 절약
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  derive-shas:
    name: Derive NX base/head SHAs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      nx_base: ${{ steps.setshas.outputs.base }}
      nx_head: ${{ steps.setshas.outputs.head }}
    steps:
      - name: Checkout (full history for Nx)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Nx Set SHAs
        id: setshas
        uses: nrwl/nx-set-shas@v5
        # base(main)와 head(PR) 커밋을 비교하여 변경된 프로젝트 범위를 계산

      - name: Print derived SHAs
        run: |
          echo "NX_BASE=${{ steps.setshas.outputs.base }}"
          echo "NX_HEAD=${{ steps.setshas.outputs.head }}"

  format:
    name: Format Check (Prettier)
    runs-on: ubuntu-latest
    needs: [derive-shas]
    permissions:
      contents: read
    env:
      NX_BASE: ${{ needs.derive-shas.outputs.nx_base }}
      NX_HEAD: ${{ needs.derive-shas.outputs.nx_head }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ vars.PNPM_VERSION }}

      - name: Setup Node.js (pnpm cache)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Format Check (Prettier)
        run: pnpm nx format:check --base=$NX_BASE --head=$NX_HEAD

  lint:
    name: Lint (affected)
    runs-on: ubuntu-latest
    needs: [derive-shas]
    permissions:
      contents: read
    env:
      NX_BASE: ${{ needs.derive-shas.outputs.nx_base }}
      NX_HEAD: ${{ needs.derive-shas.outputs.nx_head }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ vars.PNPM_VERSION }}

      - name: Setup Node.js (pnpm cache)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint (affected)
        run: pnpm nx affected -t lint --parallel=3 --base=$NX_BASE --head=$NX_HEAD

  typecheck:
    name: Typecheck (affected)
    runs-on: ubuntu-latest
    needs: [derive-shas]
    permissions:
      contents: read
    env:
      NX_BASE: ${{ needs.derive-shas.outputs.nx_base }}
      NX_HEAD: ${{ needs.derive-shas.outputs.nx_head }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ vars.PNPM_VERSION }}

      - name: Setup Node.js (pnpm cache)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck (affected)
        run: pnpm nx affected -t typecheck --parallel=3 --base=$NX_BASE --head=$NX_HEAD

  test:
    name: Unit Tests (affected)
    runs-on: ubuntu-latest
    needs: [derive-shas, format, lint, typecheck]
    permissions:
      contents: read
    env:
      NX_BASE: ${{ needs.derive-shas.outputs.nx_base }}
      NX_HEAD: ${{ needs.derive-shas.outputs.nx_head }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ vars.PNPM_VERSION }}

      - name: Setup Node.js (pnpm cache)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run Unit Tests
        run: pnpm nx affected -t test --configuration=ci --parallel=3 --base=$NX_BASE --head=$NX_HEAD

  size:
    name: Bundle Size (size-limit)
    runs-on: ubuntu-latest
    needs: [format, lint]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ vars.PNPM_VERSION }}

      - name: Setup Node.js (pnpm cache)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build libs
        run: pnpm run build:libs

      - name: size-limit
        run: pnpm run size

  a11y:
    name: Accessibility (Storybook + axe)
    runs-on: ubuntu-latest
    needs: [format, lint]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ vars.PNPM_VERSION }}

      - name: Setup Node.js (pnpm cache)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Storybook
        run: pnpm run build-storybook

      - name: Run a11y tests (axe + WCAG 2 AA)
        run: pnpm run storybook:a11y

  consumer-eval:
    name: Consumer Eval (deterministic)
    runs-on: ubuntu-latest
    needs: [format, lint]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ vars.PNPM_VERSION }}

      - name: Setup Node.js (pnpm cache)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # 카탈로그는 빌드 산출물이다. dist를 커밋하지 않으므로 git diff로 검사하지 않고,
      # 빌드가 쓴 파일과 generator 재생성 결과가 같은지를 harness 테스트가 확인한다.
      - name: Build libs (declarations + generated catalog)
        run: pnpm run build:libs

      - name: Harness typecheck and tests
        run: pnpm run tools:check

      # 모델 API 없이 도는 결정적 smoke. 유료 호출이 없다.
      - name: Deterministic eval smoke
        run: pnpm run eval:consumer:smoke

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-eval-smoke
          path: tmp/llm-evals/pr-smoke/
          retention-days: 7
          if-no-files-found: error

  build:
    name: Build (affected)
    runs-on: ubuntu-latest
    needs: [derive-shas, format, lint, typecheck, test]
    permissions:
      contents: read
    env:
      NX_BASE: ${{ needs.derive-shas.outputs.nx_base }}
      NX_HEAD: ${{ needs.derive-shas.outputs.nx_head }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ vars.PNPM_VERSION }}

      - name: Setup Node.js (pnpm cache)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Affected Projects
        run: pnpm nx affected -t build --parallel=3 --exclude=@berrypjh/demo-mobile --base=$NX_BASE --head=$NX_HEAD
