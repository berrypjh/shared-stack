<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 264" role="img" width="640" height="264">
  <title>baseUrl 없이 ./ 로 시작하지 않는 paths 는 TS5090, 루트 paths 를 ./ 상대경로로 적어 해결</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#667085" />
    </marker>
  </defs>
  <style>
    .head { font: 600 13px system-ui, sans-serif; fill: #475467; }
    .file { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #475467; }
    .code { font: 400 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #101828; }
    .note { font: 400 12px system-ui, sans-serif; fill: #475467; }
    .error { fill: #B42318; font-weight: 600; }
    .flow { fill: none; stroke: #667085; stroke-width: 1.5; }
  </style>

  <rect width="640" height="264" rx="12" fill="#FFFFFF" />
  <text class="head" x="20" y="30">TS5090 이 나는 형태 — 예</text>
  <text class="head" x="330" y="30">2026-01-24 — ./ 상대경로로</text>
  <rect x="20" y="46" width="296" height="136" rx="8" fill="#F2F4F7" stroke="#D0D5DD" />
  <text class="file" x="32" y="65">tsconfig (baseUrl 없음)</text>
  <line x1="20" y1="74" x2="316" y2="74" stroke="#D0D5DD" />
  <rect x="26" y="128" width="284" height="17" rx="4" fill="#B4231812" stroke="#B42318" stroke-opacity="0.6" />
  <text class="code" x="32" y="92" xml:space="preserve">&quot;compilerOptions&quot;: {</text>
  <text class="code" x="32" y="108" xml:space="preserve">  &quot;paths&quot;: {</text>
  <text class="code" x="32" y="124" xml:space="preserve">    &quot;@berrypjh/ui-core&quot;:</text>
  <text class="code" x="32" y="140" xml:space="preserve">      [&quot;libs/ui-core/src/index.ts&quot;]</text>
  <text class="code" x="32" y="156" xml:space="preserve">  }</text>
  <text class="code" x="32" y="172" xml:space="preserve">}</text>
  <text class="note error" x="20" y="204">./ 로 시작하지 않는 값 — rollup build 가 멈춤</text>
  <rect x="330" y="46" width="290" height="168" rx="8" fill="#F2F4F7" stroke="#D0D5DD" />
  <text class="file" x="342" y="65">tsconfig.base.json</text>
  <line x1="330" y1="74" x2="620" y2="74" stroke="#D0D5DD" />
  <rect x="336" y="128" width="278" height="49" rx="4" fill="#04785714" stroke="#047857" stroke-opacity="0.6" />
  <text class="code" x="342" y="92" xml:space="preserve">&quot;compilerOptions&quot;: {</text>
  <text class="code" x="342" y="108" xml:space="preserve">  &quot;paths&quot;: {</text>
  <text class="code" x="342" y="124" xml:space="preserve">    &quot;@berrypjh/ui-core&quot;:</text>
  <text class="code" x="342" y="140" xml:space="preserve">      [&quot;./libs/ui-core/src/index.ts&quot;],</text>
  <text class="code" x="342" y="156" xml:space="preserve">    &quot;@berrypjh/react-ui&quot;:</text>
  <text class="code" x="342" y="172" xml:space="preserve">      [&quot;./libs/react-ui/src/index.ts&quot;]</text>
  <text class="code" x="342" y="188" xml:space="preserve">  }</text>
  <text class="code" x="342" y="204" xml:space="preserve">}</text>
  <text class="note" x="330" y="236">ui-core tsconfig.lib.json 의 "baseUrl": "." 도 지움</text>
</svg>
