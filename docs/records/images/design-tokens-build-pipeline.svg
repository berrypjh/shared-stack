  <rect x="488" y="130" width="120" height="48" rx="8" fill="#F2F4F7" stroke="#D0D5DD" />
  <text class="code" x="498" y="150">dist/</text>
  <text class="code" x="498" y="166">*.js · *.d.ts</text>
  <path class="flow" d="M128 174 L144 174" marker-end="url(#arrow)" />
  <path class="flow" d="M308 170 L320 156" marker-end="url(#arrow)" />
  <path class="flow" d="M308 230 L320 246" marker-end="url(#arrow)" />
  <path class="flow" d="M444 154 L486 154" marker-end="url(#arrow)" />
