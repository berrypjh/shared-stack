<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 332" role="img" width="640" height="332">
  <title>design-tokens build — build:tokens 가 Style Dictionary 로 만들고 build:ts 가 tsc 로 컴파일</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#667085" />
    </marker>
  </defs>
  <style>
    .mono { font: 400 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #101828; }
    .code { font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #101828; }
    .strong { font-weight: 700; }
    .note { font: 400 11.5px system-ui, sans-serif; fill: #475467; }
    .small { font: 600 10.5px system-ui, sans-serif; }
    .dim { fill: #475467; font-weight: 400; }
    .accent { fill: #047857; }
    .flow { fill: none; stroke: #667085; stroke-width: 1.5; }
  </style>

  <rect width="640" height="332" rx="12" fill="#FFFFFF" />
  <rect x="20" y="16" width="600" height="34" rx="8" fill="none" stroke="#D0D5DD" stroke-dasharray="4 3" />
  <text class="mono strong" x="32" y="38">build</text>
  <text class="note" x="80" y="38">nx:noop — dependsOn: build:tokens, build:ts. 두 단계를 잇기만 함</text>
  <rect x="20" y="64" width="436" height="252" rx="10" fill="none" stroke="#047857" stroke-opacity="0.5" />
  <text class="mono strong" x="32" y="86">build:tokens</text>
  <text class="note" x="130" y="86">tsx src/build.ts</text>
  <rect x="476" y="64" width="144" height="252" rx="10" fill="none" stroke="#047857" stroke-opacity="0.5" />
  <text class="mono strong" x="488" y="86">build:ts</text>
  <text class="note" x="488" y="104">tsc -p tsconfig.lib.json</text>
  <path class="flow" d="M456 82 L474 82" marker-end="url(#arrow)" />
  <rect x="32" y="150" width="96" height="48" rx="8" fill="#F2F4F7" stroke="#D0D5DD" />
  <text class="mono" x="42" y="170">tokens/</text>
  <text class="mono" x="42" y="186">data.json</text>
  <text class="small dim" x="32" y="216">global · dark 로</text>
  <text class="small dim" x="32" y="231">분리 · 병합</text>
  <rect x="146" y="112" width="162" height="180" rx="8" fill="#F2F4F7" stroke="#D0D5DD" />
  <text class="mono strong" x="156" y="150">Style Dictionary</text>
  <text class="small accent" x="156" y="166">포맷</text>
  <text class="code" x="156" y="182">cssVariables</text>
  <text class="code" x="156" y="198">jsonFlatTokens</text>
  <text class="code" x="156" y="214">tsThemeTokens</text>
  <text class="small accent" x="156" y="230">트랜스폼</text>
  <text class="code" x="156" y="246">fontWeightNameToNumber</text>
  <text class="code" x="156" y="262">reactNativeNumber</text>
  <rect x="322" y="130" width="124" height="48" rx="8" fill="#F2F4F7" stroke="#D0D5DD" />
  <text class="code" x="332" y="150">src/.generated/</text>
  <text class="code" x="332" y="166">web · rn tokens.ts</text>
  <rect x="322" y="226" width="124" height="48" rx="8" fill="#F2F4F7" stroke="#D0D5DD" />
  <text class="code" x="332" y="246">dist/css/</text>
  <text class="code" x="332" y="262">variables.css</text>
