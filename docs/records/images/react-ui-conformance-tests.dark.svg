<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 328" role="img" width="640" height="328">
  <title>컴포넌트는 최소 요소와 옵션만 넘기고, describeConformance 가 공통 계약 테스트를 만듦</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#98A2B3" />
    </marker>
  </defs>
  <style>
    .file { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #98A2B3; }
    .code { font: 400 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #F2F4F7; }
    .note { font: 400 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #98A2B3; }
    .dim { fill: #98A2B3; }
    .flow { fill: none; stroke: #98A2B3; stroke-width: 1.5; }
  </style>

  <rect width="640" height="328" rx="12" fill="#1D2939" />
  <rect x="20" y="20" width="600" height="136" rx="8" fill="#101828" stroke="#344054" />
  <text class="file" x="32" y="39">SkipLink.test.tsx</text>
  <line x1="20" y1="48" x2="620" y2="48" stroke="#344054" />
  <rect x="26" y="118" width="588" height="17" rx="4" fill="#4DBA851F" stroke="#4DBA85" stroke-opacity="0.6" />
  <text class="code" x="32" y="66" xml:space="preserve">describeConformance(&lt;SkipLink targetId=&quot;main&quot;&gt;본문으로 건너뛰기&lt;/SkipLink&gt;, () =&gt; ({</text>
  <text class="code" x="32" y="82" xml:space="preserve">  render,</text>
  <text class="code" x="32" y="98" xml:space="preserve">  classes: skipLinkClasses,</text>
  <text class="code" x="32" y="114" xml:space="preserve">  refInstanceof: HTMLAnchorElement,</text>
  <text class="code" x="32" y="130" xml:space="preserve">  skip: [&#x27;polymorphicProp&#x27;],</text>
  <text class="code" x="32" y="146" xml:space="preserve">}));</text>
  <path class="flow" d="M320 158 L320 186" marker-end="url(#arrow)" />
  <text class="note" x="330" y="176">pnpm nx test @berrypjh/react-ui</text>
  <rect x="20" y="188" width="600" height="120" rx="8" fill="#101828" stroke="#344054" />
  <text class="file" x="32" y="207">&lt;SkipLink /&gt; › component API</text>
  <line x1="20" y1="216" x2="620" y2="216" stroke="#344054" />
  <rect x="26" y="222" width="588" height="65" rx="4" fill="#4DBA851F" stroke="#4DBA85" stroke-opacity="0.6" />
  <text class="code" x="32" y="234" xml:space="preserve">✓ className이 root element에 적용되어야 한다</text>
  <text class="code" x="32" y="250" xml:space="preserve">✓ 추가 props가 root element에 전달되어야 한다</text>
  <text class="code" x="32" y="266" xml:space="preserve">✓ ref가 기대한 인스턴스로 전달되어야 한다</text>
  <text class="code" x="32" y="282" xml:space="preserve">✓ 기본 root 클래스가 root element에 유지되어야 한다</text>
  <text class="code dim" x="32" y="298" xml:space="preserve">  polymorphicProp — skip 으로 뺌</text>
</svg>
